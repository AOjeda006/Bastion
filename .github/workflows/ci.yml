name: CI

# Integración continua de Bastion (§14 del plan maestro).
#
# Vive en `.github/workflows/` y no en `deploy/.github/workflows/` como dibuja el §12:
# GitHub Actions SOLO ejecuta lo que encuentra en la raíz del repositorio. La decisión
# está anotada en `docs/PLAN.md`.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un push nuevo cancela el run anterior de la misma rama: el runner no gasta minutos
# en un commit que ya nadie va a mirar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ==================================================================== FRONTAL
  # Corre de verdad desde el primer commit.
  frontend:
    name: Frontal (bastion-web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` y no `npm install`: instala EXACTAMENTE el lockfile y falla si el
      # package.json y el lock han divergido. Es la diferencia entre una construcción
      # reproducible y una que depende del día.
      - name: Instalar dependencias
        run: npm ci

      # El mismo cerrojo que `docs/api/openapi.json`, un eslabón más abajo. Que el documento esté al
      # día no dice nada del cliente: `esquema.ts` se genera de él, se versiona, y entre uno y otro
      # cabe perfectamente un contrato nuevo con un cliente viejo — que compila, porque el
      # compilador solo ve el fichero generado, y miente en tiempo de ejecución. Nunca se escribe a
      # mano un tipo del contrato, y esto es lo que lo comprueba.
      - name: Contrato — el cliente generado no se ha quedado atrás
        run: |
          npm run api
          # `git status` y no `git diff`: si el fichero generado no estuviera versionado, `git diff`
          # no vería nada y el paso daría verde sin haber comprobado nada. `status` lo ve igual.
          ESTADO="$(git status --porcelain -- src/shared/api/esquema.ts)"
          if [ -z "$ESTADO" ]; then
            echo "::notice title=Contrato::src/shared/api/esquema.ts está al día con docs/api/openapi.json."
            exit 0
          fi
          # El diff va DENTRO de la anotación: los registros de un job devuelven 403 sin
          # autenticar, así que un `echo` aquí sería un diagnóstico que no se puede leer desde
          # fuera. Es la misma razón que en el paso de OpenAPI del backend.
          DIFERENCIAS="$(git diff -- src/shared/api/esquema.ts | head -80)"
          [ -n "$DIFERENCIAS" ] || DIFERENCIAS="$ESTADO"
          ESCAPADO="$(printf '%s' "$DIFERENCIAS" | awk '{ gsub(/%/, "%25"); printf "%s%%0A", $0 }')"
          echo "::error title=Contrato::El cliente generado se ha quedado atrás. Regenéralo y commitéalo: cd frontend && npm run api%0A%0A${ESCAPADO}"
          exit 1

      - name: Tipos
        run: npm run typecheck

      - name: Linter
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tests
        run: npm run test

      - name: Construir
        run: npm run build

      # Presupuesto de tamaño (§14): que el frontal engorde tiene que doler en la CI, no en el
      # arranque del usuario seis meses después.
      #
      # SON DOS TOPES Y NO UNO desde el ítem 1.1, y el motivo es que el de antes había dejado de
      # medir lo que decía. Este paso hacía `du -sk --exclude='*.map' dist` contra 600 kB, con el
      # razonamiento correcto escrito al lado —los `.map` no se descargan al arrancar, así que
      # contarlos «medía otra cosa distinta de la que dice esta frase»—. Desde el 0.11 las rutas se
      # cargan tarde, así que ESE MISMO razonamiento se le aplica al propio `du`: sumaba siete
      # fragmentos que el navegador no pide al arrancar.
      #
      # Y no era un tope laxo: era un tope que castigaba lo correcto. Comprobado por el efecto al
      # decidirlo —haciendo estática una ruta que estaba diferida, el arranque saltó de 391 a 507
      # KiB y el `du` de antes BAJÓ de 554 a 546 kB, o sea que la métrica vieja se ponía MÁS verde
      # ante un empeoramiento real—.
      #
      #   arranque (450 KiB) — lo que `index.html` referencia, que es lo que se paga antes de
      #                        pintar nada. Hoy 391 KiB: ~2 s en una 4G de 1,6 Mbps efectivos.
      #   total    (900 KiB) — todo lo servido menos los mapas. Vigila el crecimiento global sin
      #                        castigar el troceo. Hoy 532 KiB.
      #
      # El día que suban, suben con su motivo escrito y no porque nadie los estuviera mirando.
      # Argumento entero en `docs/adr/adr-0028-el-presupuesto-mide-el-arranque-no-la-suma-de-los-fragmentos.md`.
      - name: Presupuesto de tamaño
        run: bash ../scripts/ci/presupuesto-del-frontal.sh dist 450 900

      - name: Publicar el frontal construido
        uses: actions/upload-artifact@v7
        with:
          name: bastion-web-dist
          path: frontend/dist
          retention-days: 7

      # PUBLICAR NO ES HABER PUBLICADO LO QUE SE DICE. `upload-artifact` sale verde habiendo
      # subido un zip vacío si el `path` no casa con nada, y sale verde subiendo la mitad si
      # algo queda fuera por ser oculto. Con el salto de major de este ítem (v4 -> v7) la cosa
      # se agrava: en esta familia los cambios mayores han tocado justo el trato de nombres,
      # de sobrescritura, de fusión y de ficheros ocultos. Un artefacto mal formado no pone
      # rojo ningún paso; se descubre meses después, cuando alguien lo necesita.
      #
      # Así que se BAJA y se mira lo que hay dentro. Es la misma regla que el resto del
      # proyecto: por el efecto, no por el fichero.
      - name: Bajar el artefacto del frontal
        uses: actions/download-artifact@v8
        with:
          name: bastion-web-dist
          path: ${{ github.workspace }}/comprobacion/bastion-web-dist

      - name: El artefacto del frontal contiene el frontal
        working-directory: ${{ github.workspace }}
        run: |
          RAIZ=comprobacion/bastion-web-dist
          test -f "$RAIZ/index.html" || { echo "::error title=Artefacto bastion-web-dist::No hay index.html dentro del artefacto."; exit 1; }
          grep -q '<div id="root"></div>' "$RAIZ/index.html" || { echo "::error title=Artefacto bastion-web-dist::El index.html del artefacto no es el del frontal."; exit 1; }
          JS=$(find "$RAIZ" -name '*.js' -type f | wc -l)
          CSS=$(find "$RAIZ" -name '*.css' -type f | wc -l)
          FICHEROS=$(find "$RAIZ" -type f | wc -l)
          if [ "$JS" -lt 1 ] || [ "$CSS" -lt 1 ]; then
            echo "::error title=Artefacto bastion-web-dist::Dentro hay ${FICHEROS} ficheros, ${JS} .js y ${CSS} .css. Un frontal construido lleva al menos uno de cada."
            exit 1
          fi
          echo "::notice title=Artefacto bastion-web-dist::${FICHEROS} ficheros, ${JS} .js y ${CSS} .css, con index.html del frontal."

  # ==================================================================== BACKEND
  # Mientras `Bastion.sln` no exista (ítem 0.1 de docs/PLAN.md), este job DECLARA que
  # no ha comprobado nada en lugar de fingir un verde o dejar la CI en rojo sin
  # explicación. En cuanto el 0.1 cree la solución, los pasos se activan solos: no hay
  # que tocar este fichero, y a partir de ahí un fallo suyo es un fallo de verdad.
  backend:
    name: Backend (Bastion.sln)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ¿Existe ya la solución?
        id: solucion
        run: |
          if [ -f Bastion.sln ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Backend: pendiente del ítem 0.1"
              echo
              echo "No existe \`Bastion.sln\`, así que **no se ha compilado ni probado nada del backend**."
              echo "Esto es lo esperado hasta que se complete el ítem 0.1 del checklist de \`docs/PLAN.md\`;"
              echo "el agente de configuración no pudo crear la solución porque su entorno no tenía el SDK de .NET."
              echo
              echo "Este job se activa solo en cuanto exista la solución. **No hay que tocar el workflow.**"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Backend sin comprobar: falta Bastion.sln (ítem 0.1 de docs/PLAN.md)."
          fi

      - name: .NET
        if: steps.solucion.outputs.existe == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # Aquí hubo un `mkdir -p ~/.nuget/packages` desde el ADR-0002, y se retira en el 0.13
      # porque su motivo ya no existe: `actions/setup-dotnet` fallaba en su POST-step cuando la
      # carpeta de paquetes no se creaba nunca, y no se creaba porque los `packages.lock.json`
      # solo tenían entradas "type": "Project". Hoy tienen 17 directas, 102 transitivas y 31
      # centrales, así que `restore` la crea él. La retirada estaba prescrita para este ítem.
      - name: Restaurar
        if: steps.solucion.outputs.existe == 'true'
        run: dotnet restore Bastion.sln

      # Herramientas LOCALES (.config/dotnet-tools.json): `dotnet ef` entre ellas. Sin este
      # paso, el guardián de migraciones fallaría con «no se reconoce el comando ef», que es
      # un diagnóstico que no dice nada de las migraciones.
      - name: Restaurar herramientas
        if: steps.solucion.outputs.existe == 'true'
        run: dotnet tool restore

      - name: Compilar
        if: steps.solucion.outputs.existe == 'true'
        run: dotnet build Bastion.sln --configuration Release --no-restore

      # Estilo y formato. Va aparte del build a propósito (ver Directory.Build.props):
      # un build roto significa siempre "el código está mal", nunca "falta un espacio".
      - name: Formato
        if: steps.solucion.outputs.existe == 'true'
        run: dotnet format Bastion.sln --verify-no-changes --no-restore

      # Rápidos y sin Docker: dominio puro + fitness functions de las fronteras del §4.
      # Van PRIMERO porque son los que fallan en segundos, no en minutos.
      #
      # Cada paso escribe en SU directorio y sin `LogFileName` fijo: `dotnet test` sobre la
      # solución genera un .trx POR ENSAMBLADO, y con un nombre fijo el segundo pisaba al
      # primero ("ADVERTENCIA: Se sobrescribirá el archivo de resultados"). El artefacto
      # publicado solo traía la mitad de los resultados.
      #
      # El recuento no es decoración: un `--filter` que no casa con nada y un ensamblado que
      # ya no se encuentra salen con código 0, igual que un verde de verdad. El paso solo
      # pasa si ejecuta al menos el mínimo declarado, y lo publica como `::notice::` —los
      # registros del job devuelven 403 sin autenticar, las anotaciones no.
      - name: Tests de dominio y de arquitectura
        if: steps.solucion.outputs.existe == 'true'
        run: |
          # El `dotnet test` NO decide el desenlace del paso: lo decide el recuento, que se
          # ejecuta SIEMPRE. Si se dejara abortar aquí, un rojo de test se vería desde fuera
          # como «Process completed with exit code 1» y nada más —los registros son 403 sin
          # autenticar—, sin el nombre del caso ni la aserción.
          set +e
          dotnet test Bastion.sln \
            --configuration Release \
            --no-build \
            --filter "Category!=Integracion" \
            --logger "trx" \
            --results-directory artifacts/test-results/dominio
          resultado=$?
          set -e
          # DOS defensas, y la segunda es la que de verdad protege.
          #
          # El SUELO de casos (300) es una red gruesa: no es el numero de hoy (403), sino
          # aquel por debajo del cual se ha perdido algo gordo. Y hay que decir hasta donde
          # llega, porque es menos de lo que parece. La cuenta que sigue es la MEDIDA DEL 0.13,
          # y esta aqui como argumento, no como inventario: el numero de hoy lo publica este
          # paso como anotacion en cada run. Con 403 casos en cinco ensamblados -111
          # BuildingBlocks, 116 Organizacion, 103 Api.Functional, 58 Identidad y 15
          # Arquitectura-, perder uno entero deja: 292, 287, 300, 345 y 388. El suelo falla
          # cuando el total es MENOR que 300, asi que solo caza los dos primeros. Perder
          # Api.Functional deja 300 clavados y PASA; perder Identidad o Arquitectura pasa de
          # sobra. Dos de cinco, y a peor: cuanto mas grande es el total, menos se nota la
          # perdida de una parte.
          #
          # La LISTA DE ENSAMBLADOS es la defensa que corresponde, y es la del resto del
          # proyecto: se compara entera, en las dos direcciones. Uno que desaparece se nombra
          # -no baja un numero: falta «Bastion.Identidad.UnitTests.dll»-, y uno que aparece
          # obliga a declararlo aqui. Solo cuenta el que ejecuta al menos un caso, asi que un
          # ensamblado que se queda a cero porque el filtro dejo de casar tambien sale rojo.
          bash scripts/ci/recuento-de-tests.sh \
            artifacts/test-results/dominio "Dominio y arquitectura" 300 \
            "Bastion.Api.FunctionalTests.dll,Bastion.Arquitectura.Tests.dll,Bastion.BuildingBlocks.UnitTests.dll,Bastion.Identidad.UnitTests.dll,Bastion.Organizacion.UnitTests.dll"
          exit $resultado

      # Un esquema y un modelo que divergen es un despliegue roto en diferido (§14).
      #
      # Va ANTES de los tests de integración a propósito: tarda segundos, no necesita Docker y
      # diagnostica en UNA línea lo que, si no, aparece como veinte tests de integración en rojo
      # por «la relación no existe» — media hora mirando el sitio equivocado.
      - name: Migraciones — el modelo no tiene cambios pendientes
        if: steps.solucion.outputs.existe == 'true'
        env:
          CONFIGURACION: Release
        run: |
          if [ -f scripts/comprobar-migraciones.sh ]; then
            bash scripts/comprobar-migraciones.sh
          else
            echo "::notice::Sin comprobación de migraciones todavía (se añade con el primer DbContext, ítem 0.4)."
          fi

      # El documento OpenAPI es el contrato del que se genera el cliente de TypeScript del
      # frontal, y está VERSIONADO. Generarlo sin comprobar que sigue al día sería volver a tener
      # dos fuentes de verdad con un paso extra en medio: el cliente parecería derivado del
      # contrato sin estarlo.
      #
      # Misma forma que el paso de migraciones, y por lo mismo: tarda segundos, no necesita
      # Docker, y no encadena este trabajo con el del frontal ni le pasa artefactos. El frontal
      # lee el fichero del repositorio, que es lo que un desarrollador tiene delante.
      - name: OpenAPI — el contrato versionado no se ha quedado atrás
        if: steps.solucion.outputs.existe == 'true'
        env:
          CONFIGURACION: Release
        run: |
          if [ -f scripts/generar-openapi.sh ]; then
            bash scripts/generar-openapi.sh --comprobar
          else
            echo "::notice::Sin documento OpenAPI todavía (se añade en el ítem 0.11)."
          fi

      # Testcontainers levanta PostgreSQL de verdad. Nada de EF Core InMemory: no traduce
      # SQL real, ignora restricciones, columnas computadas y filtros globales, y da
      # falsos verdes (`stacks/dotnet/convenciones.md`).
      #
      # Mínimo 1 desde el ítem 0.4: ya hay tests de integración contra PostgreSQL real, así que
      # un cero aquí ya no significa "todavía no los hay" sino "han dejado de ejecutarse".
      - name: Tests de integración (Testcontainers)
        if: steps.solucion.outputs.existe == 'true'
        run: |
          # Igual que el paso anterior: el recuento se ejecuta siempre y es quien decide.
          set +e
          dotnet test Bastion.sln \
            --configuration Release \
            --no-build \
            --filter "Category=Integracion" \
            --logger "trx" \
            --results-directory artifacts/test-results/integracion
          resultado=$?
          set -e
          # Mismo criterio y misma pareja de defensas. Aqui el suelo protegia todavia menos: el
          # carril son DOS ensamblados muy desiguales, y perder el pequeño deja al grande por
          # encima del suelo. De dos, cubria uno.
          #
          # Y este comentario NO dice cuantos casos hay, a proposito. El que habia si lo decia
          # -«142 (114 de la API + 28 de Organizacion)»- y llevaba items mintiendo, porque un
          # numero escrito en un comentario no lo actualiza nadie. La cuenta de verdad la publica
          # este mismo paso como anotacion en cada run, que es donde no puede quedarse vieja.
          #
          # La lista de ensamblados es la que caza los dos, y por su nombre.
          bash scripts/ci/recuento-de-tests.sh \
            artifacts/test-results/integracion "Integración (Testcontainers)" 100 \
            "Bastion.Api.IntegrationTests.dll,Bastion.Organizacion.IntegrationTests.dll"
          exit $resultado

      # El OpenAPI es el contrato del que se genera el cliente de TypeScript: se publica
      # como artefacto para que el frontal lo consuma en vez de escribir DTOs a mano.
      - name: Publicar el OpenAPI
        if: steps.solucion.outputs.existe == 'true' && hashFiles('docs/api/openapi.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: openapi
          path: docs/api/openapi.json
          retention-days: 30

      - name: Publicar resultados de test
        if: always() && steps.solucion.outputs.existe == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 7

      # Lo mismo que en el frontal, y aquí importa más: estos dos artefactos son el contrato
      # de la API y la única prueba conservada de qué se ejecutó. Se bajan y se abre lo que
      # traen dentro. Ver el porqué largo en el job del frontal.
      - name: Bajar el artefacto del OpenAPI
        if: always() && steps.solucion.outputs.existe == 'true' && hashFiles('docs/api/openapi.json') != ''
        uses: actions/download-artifact@v8
        with:
          name: openapi
          path: comprobacion/openapi

      - name: El artefacto del OpenAPI contiene el contrato
        if: always() && steps.solucion.outputs.existe == 'true' && hashFiles('docs/api/openapi.json') != ''
        run: |
          FICHERO=comprobacion/openapi/openapi.json
          test -f "$FICHERO" || { echo "::error title=Artefacto openapi::No hay openapi.json dentro del artefacto."; exit 1; }
          # Se compara con el del repositorio, byte a byte: el artefacto tiene que ser ESE
          # documento y no otro parecido. Y de paso se comprueba que trae rutas de verdad.
          if ! cmp -s "$FICHERO" docs/api/openapi.json; then
            echo "::error title=Artefacto openapi::El openapi.json del artefacto no es el del repositorio."
            exit 1
          fi
          RUTAS=$(grep -o '"/api/v1/[^"]*"' "$FICHERO" | sort -u | wc -l)
          if [ "$RUTAS" -lt 1 ]; then
            echo "::error title=Artefacto openapi::El documento no declara ninguna ruta /api/v1/."
            exit 1
          fi
          echo "::notice title=Artefacto openapi::openapi.json idéntico al del repositorio, con ${RUTAS} rutas /api/v1/."

      - name: Bajar el artefacto de resultados de test
        if: always() && steps.solucion.outputs.existe == 'true'
        uses: actions/download-artifact@v8
        with:
          name: test-results
          path: comprobacion/test-results

      - name: El artefacto de resultados contiene los .trx
        if: always() && steps.solucion.outputs.existe == 'true'
        run: |
          RAIZ=comprobacion/test-results
          # `upload-artifact` conserva la estructura por debajo del `path`, así que dentro
          # tienen que estar las dos carpetas de carril con sus .trx. Que estén las DOS es lo
          # que distingue «se subieron los resultados» de «se subió la mitad».
          for CARRIL in dominio integracion; do
            CUANTOS=$(find "$RAIZ/$CARRIL" -name '*.trx' -type f 2>/dev/null | wc -l)
            if [ "$CUANTOS" -lt 1 ]; then
              echo "::error title=Artefacto test-results::No hay ningún .trx de ${CARRIL} dentro del artefacto."
              exit 1
            fi
            CASOS=$(grep -ho '<Counters[^/]*/>' "$RAIZ/$CARRIL"/*.trx | sed -n 's/.*[^A-Za-z]total="\([0-9]*\)".*/\1/p' | awk '{ s += $1 } END { print s + 0 }')
            echo "::notice title=Artefacto test-results::${CARRIL}: ${CUANTOS} ficheros .trx con ${CASOS} casos dentro del artefacto."
          done

  # ==================================================================== IMÁGENES
  # AQUÍ HUBO UN JOB `imagenes`, y se retira en el 0.13. Construía las dos imágenes con
  # `docker/build-push-action` sin publicarlas, con los mismos `needs: [frontend, backend]` que
  # `Humo` y los mismos dos Dockerfile. `Humo` construye esas dos imágenes —`docker compose build`
  # no puede no hacerlo— y además las ARRANCA y les hace peticiones. Un job cuya única afirmación
  # es un subconjunto estricto de la de otro no añade cobertura: añade minutos y una segunda cosa
  # que actualizar. Lo que sí se pierde es la caché `type=gha` de buildx, que `compose build` no
  # usa; se acepta, porque el `Humo` construía ya por su cuenta y esa caché no le llegaba.
  # `docs/PLAN.md` dejaba las dos salidas abiertas («o bien `Humo` absorbe a `Imágenes`»): es esta.

  # ======================================================================== HUMO
  # Levanta el entorno COMPLETO con docker compose y comprueba el criterio de aceptación
  # del ítem 0.2 por el efecto, no por el fichero: que la API responde a su sonda de vida,
  # que la de disponibilidad ve PostgreSQL de verdad, que el frontal carga y que las trazas
  # llegan al visor.
  #
  # Está en la CI y no solo en la máquina de quien desarrolla porque así se comprueba
  # SIEMPRE, en un equipo limpio, y no "la vez que lo probé".
  humo:
    name: Humo (docker compose)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v5

      # Las credenciales se generan aquí y mueren con el runner. En el repositorio no hay
      # —ni puede haber— un `deploy/.env`: está en .gitignore y en .dockerignore.
      #
      # Las siete `BASTION_SEMILLA_*` se rellenan desde el 0.13, y no es cosmética: hasta ahora
      # iban vacías, la semilla no se aplicaba, y ese camino —el que crea la primera empresa y la
      # primera cuenta— NO LO EJERCÍA NADIE. La primera vez que se rellenaron, contra el compose
      # de antes de este ítem, la API ni arrancaba: la semilla consulta `organizacion.empresas`
      # antes de crear nada y la tabla no existía (ADR-0021). La contraseña se sortea aquí y no se
      # imprime en ningún sitio; las de más abajo son datos de una empresa inventada, no secretos.
      - name: Preparar deploy/.env
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SIGNING_KEY=$(openssl rand -base64 48)"
            echo "BASTION_SEMILLA_ADMIN_CORREO=admin@bastion.local"
            echo "BASTION_SEMILLA_ADMIN_CONTRASENA=$(openssl rand -base64 24)"
            echo "BASTION_SEMILLA_EMPRESA_NIF=B12345674"
            echo "BASTION_SEMILLA_EMPRESA_RAZON_SOCIAL=Bastion Humo SL"
            echo "BASTION_SEMILLA_EMPRESA_CALLE=Calle Mayor 1"
            echo "BASTION_SEMILLA_EMPRESA_CODIGO_POSTAL=28013"
            echo "BASTION_SEMILLA_EMPRESA_POBLACION=Madrid"
            echo "BASTION_SEMILLA_EMPRESA_PAIS=ES"
          } > deploy/.env

      # Valida e interpola el fichero sin levantar nada. `--quiet` es obligatorio: la salida
      # de `config` incluye las credenciales ya sustituidas.
      - name: Validar el compose
        run: docker compose -f deploy/docker-compose.yml config --quiet

      # Construir y levantar van en pasos SEPARADOS, y PostgreSQL antes que el resto, a
      # propósito: los logs de un *run* solo se leen con autenticación, así que la
      # conclusión de cada paso es la única señal pública que localiza el fallo. Un único
      # paso «up --build» solo sabe decir «algo ha fallado».
      - name: Construir las imágenes
        run: |
          set -o pipefail
          docker compose -f deploy/docker-compose.yml build --progress plain 2>&1 | tee construir.log

      - name: Levantar PostgreSQL
        run: |
          set -o pipefail
          docker compose -f deploy/docker-compose.yml up --detach --wait --wait-timeout 180 postgres 2>&1 | tee postgres.log

      # `--wait` espera a que cada servicio con sonda esté SANO, no solo arrancado.
      - name: Levantar el resto del entorno
        run: |
          set -o pipefail
          docker compose -f deploy/docker-compose.yml up --detach --wait --wait-timeout 300 2>&1 | tee levantar.log

      - name: Estado de los servicios
        run: docker compose -f deploy/docker-compose.yml ps --all

      # El migrador es un PASO DEL DESPLIEGUE con su propio resultado, así que tiene su propio
      # paso aquí: `--wait` no lo mira —un contenedor que sale no llega a estar sano nunca— y sin
      # esto su código de salida solo se vería reflejado en que la API no arranca, que es una
      # forma pésima de enterarse. Se comprueba además que aplicó ALGO: «cero migraciones» y
      # «esquema al día» salen las dos con 0, y sobre una base recién creada la primera es el
      # síntoma de un ensamblado publicado sin migraciones (ADR-0021).
      - name: El migrador ha dejado el esquema al día, y lo dice
        run: |
          CONTENEDOR=$(docker compose -f deploy/docker-compose.yml ps --all --quiet migraciones | head -1)
          if [ -z "$CONTENEDOR" ]; then
            echo "::error title=Migrador::No existe el contenedor del servicio migraciones."
            exit 1
          fi
          CODIGO=$(docker inspect --format '{{.State.ExitCode}}' "$CONTENEDOR")
          echo "El migrador ha salido con código $CODIGO."
          docker compose -f deploy/docker-compose.yml logs --no-color migraciones
          test "$CODIGO" = "0"
          REGISTRO=$(docker compose -f deploy/docker-compose.yml logs --no-color migraciones)
          # Por NOMBRE, no por cuenta. Un `grep -c` diría «tres» con tres líneas del mismo
          # contexto, y el fallo que hay que cazar aquí es justo ese: un contexto que deja de
          # migrarse porque alguien lo quitó de `MigradorDeArranque`. La lista está escrita a mano
          # a propósito —el módulo nuevo de la fase 1 tiene que añadirse aquí— y su contraejemplo
          # es que los tres nombres existen hoy: si uno deja de existir, este paso se pone rojo
          # diciendo cuál.
          FALTAN=
          for CONTEXTO in AuditoriaDbContext OrganizacionDbContext IdentidadDbContext; do
            echo "$REGISTRO" | grep -q "\"Contexto\":\"${CONTEXTO}\".*EsquemaMigrado" \
              || echo "$REGISTRO" | grep -q "EsquemaMigrado.*\"Contexto\":\"${CONTEXTO}\"" \
              || FALTAN="${FALTAN} ${CONTEXTO}"
          done
          if [ -n "$FALTAN" ]; then
            echo "::error title=Migrador::Sobre una base recién creada los TRES contextos con persistencia tienen que migrarse, y estos no lo dicen:${FALTAN}."
            exit 1
          fi
          echo "::notice title=Migrador::Esquema aplicado por los tres contextos: Auditoría, Organización e Identidad."

      # LA MITAD DE F3 QUE NO SE VE COMPILANDO. `db/semillas` salió del `.dockerignore`, y eso
      # solo mete los ficheros en el CONTEXTO de construcción: `Dockerfile.api` se lleva a la
      # imagen final únicamente `/publicado`. Que lleguen ahí depende del `<Content Include>` con
      # `CopyToPublishDirectory` de `Bastion.Organizacion.Infrastructure.csproj`, y
      # `dotnet publish` no dice ni una palabra si eso se cae. Aquí se mira DENTRO de la imagen ya
      # construida, que es el único sitio donde la respuesta es la del despliegue.
      #
      # La lista va ESCRITA A MANO y se compara entera, no con un `grep -c`: un `find` que no
      # encuentra nada devuelve cero líneas SIN error, que es exactamente el fallo que este paso
      # viene a cazar. Comparadas las dos listas, ni faltar ni sobrar pasa desapercibido.
      - name: Las semillas viajan DENTRO de la imagen
        run: |
          LISTAR="cd /app/semillas 2>/dev/null && ls -1 *.json 2>/dev/null | sort"
          ENCONTRADAS=$(docker compose -f deploy/docker-compose.yml exec -T api sh -c "$LISTAR" || true)
          # Sin comillas a propósito: colapsa los saltos de línea a espacios para poder comparar
          # la lista entera de una vez. Y si no hay nada, `$ENCONTRADAS` queda vacía, que no es
          # igual a lo esperado — que es lo que tiene que pasar.
          ENCONTRADAS=$(echo $ENCONTRADAS)
          ESPERADAS="impuestos.json unidades-de-medida.json"
          echo "En /app/semillas de la imagen: ${ENCONTRADAS:-(nada)}"
          if [ "$ENCONTRADAS" != "$ESPERADAS" ]; then
            echo "::error title=Semillas::Dentro de la imagen no están las semillas que el migrador carga. El <Content Include> de Bastion.Organizacion.Infrastructure no las está publicando."
            exit 1
          fi
          echo "::notice title=Semillas::Las dos semillas viajan dentro de la imagen, en /app/semillas."

      # Y AHORA POR EL EFECTO, que es lo que de verdad importa: que los ficheros estén dentro de
      # la imagen no dice que el migrador los haya cargado. Se cuentan las filas EN LA BASE del
      # entorno desplegado, y se comprueba además un dato concreto —el tipo general del IVA
      # vigente— porque un recuento mayor que cero lo cumpliría igual una carga que hubiera metido
      # cualquier cosa. El migrador ya afirma conjunto no vacío por dentro y sale con 1 si no
      # cuadra; esto es la comprobación independiente, desde fuera y sobre la base de verdad.
      - name: El migrador ha dejado los maestros DENTRO de la base
        run: |
          # Las credenciales son las del compose: usuario y base van por omisión, y la contraseña
          # no hace falta porque `psql` entra por el socket local del propio contenedor.
          consultar() {
            docker compose -f deploy/docker-compose.yml exec -T postgres psql -U bastion -d bastion_dev -tAc "$1"
          }
          IMPUESTOS=$(consultar 'select count(*) from organizacion.impuestos')
          UNIDADES=$(consultar 'select count(*) from organizacion.unidades_de_medida')
          VIGENTE=$(consultar "select porcentaje from organizacion.impuestos where codigo = 'IVA-GENERAL' and vigente_hasta is null")
          echo "impuestos=$IMPUESTOS unidades=$UNIDADES iva_general_vigente=$VIGENTE"
          case "$IMPUESTOS" in ''|*[!0-9]*) IMPUESTOS=0 ;; esac
          case "$UNIDADES" in ''|*[!0-9]*) UNIDADES=0 ;; esac
          if [ "$IMPUESTOS" -lt 1 ] || [ "$UNIDADES" -lt 1 ]; then
            echo "::error title=Semillas::El esquema está migrado pero los maestros no están dentro (impuestos=${IMPUESTOS}, unidades=${UNIDADES}). Un catálogo de impuestos vacío no da error hasta la primera factura."
            exit 1
          fi
          if [ "$VIGENTE" != "21.00" ]; then
            echo "::error title=Semillas::El IVA general vigente sembrado es «${VIGENTE}» y tenía que ser 21.00. O la semilla se ha editado, o hay más de un tramo abierto."
            exit 1
          fi
          echo "::notice title=Semillas::Maestros cargados por el migrador: ${IMPUESTOS} tramos de impuesto y ${UNIDADES} unidades; el IVA general vigente es del ${VIGENTE} %."

      - name: La API responde a su sonda de VIDA
        run: |
          RESPUESTA=$(curl --fail --silent --show-error http://localhost:8080/health/live)
          echo "/health/live -> $RESPUESTA"
          test "$RESPUESTA" = "Healthy"

      # Esto es lo que NO puede comprobar un test funcional en memoria: que hay un
      # PostgreSQL de verdad al otro lado y que la API sabe llegar a él.
      - name: La sonda de DISPONIBILIDAD ve PostgreSQL
        run: |
          RESPUESTA=$(curl --fail --silent --show-error http://localhost:8080/health/ready)
          echo "/health/ready -> $RESPUESTA"
          echo "$RESPUESTA" | grep -q '"nombre":"base-de-datos","estado":"Healthy"'

      # La denegacion por omision, comprobada sobre el entorno que se DESPLIEGA y no sobre el
      # host en memoria de los tests. Es middleware puro: no toca la base, asi que dice lo mismo
      # con el esquema migrado o sin migrar. Un 404 aqui seria la mala noticia —la peticion habria
      # entrado y buscado el recurso—, y un 200, la peor de todas.
      - name: La API desplegada no atiende a quien no se identifica
        run: |
          RUTA=http://localhost:8080/api/v1/organizacion/empresas
          CODIGO=$(curl --silent --output /dev/null --write-out '%{http_code}' "$RUTA")
          echo "GET /api/v1/organizacion/empresas sin credenciales -> $CODIGO"
          test "$CODIGO" = "401"

      # LA SONDA QUE LEE UNA TABLA, y el motivo de que exista está medido: hasta el 0.13 este job
      # comprobaba la sonda de vida, la de disponibilidad, que el frontal carga, que reenvía /api
      # y que las trazas llegan. NINGUNA de esas peticiones toca una tabla. La de disponibilidad
      # pregunta si PostgreSQL acepta conexiones y responde, y eso es verdad sobre una base vacía:
      # el entorno estaba verde y no podía atender una petición que leyera datos. Contra el
      # despliegue de antes de este ítem, este mismo paso daba 500 — que es lo que lo convierte en
      # una sonda y no en un adorno.
      #
      # Inicia sesión DE VERDAD con la cuenta sembrada: no se forja ningún testigo aquí, igual que
      # no se forja en los tests de integración. La contraseña se lee del `.env` que este job
      # generó y no se imprime.
      - name: Iniciar sesión con la cuenta sembrada devuelve un testigo
        run: |
          CONTRASENA=$(sed -n 's/^BASTION_SEMILLA_ADMIN_CONTRASENA=//p' deploy/.env)
          test -n "$CONTRASENA"
          CODIGO=$(curl --silent --output sesion.json --write-out '%{http_code}' \
            --request POST http://localhost:8080/api/v1/identidad/sesiones \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg c admin@bastion.local --arg p "$CONTRASENA" '{correo:$c,contrasena:$p}')")
          echo "POST /api/v1/identidad/sesiones -> $CODIGO"
          if [ "$CODIGO" != "200" ]; then
            echo "::error title=Sesión::La cuenta sembrada no ha podido iniciar sesión (HTTP ${CODIGO}). Sin esquema o sin semilla, esta llamada es la primera que lo nota."
            exit 1
          fi
          TESTIGO=$(jq -r '.tokenDeAcceso // empty' sesion.json)
          test -n "$TESTIGO"
          # El testigo es una credencial viva: se guarda en un fichero del runner, nunca en la
          # salida ni en `$GITHUB_ENV`. Se anota solo su longitud, que no revela nada.
          printf '%s' "$TESTIGO" > testigo.txt
          echo "::notice title=Sesión::La cuenta sembrada ha iniciado sesión; el testigo tiene ${#TESTIGO} caracteres."

      - name: Una petición que LEE UNA TABLA devuelve los datos sembrados
        run: |
          CODIGO=$(curl --silent --output empresas.json --write-out '%{http_code}' \
            http://localhost:8080/api/v1/organizacion/empresas \
            --header "Authorization: Bearer $(cat testigo.txt)")
          echo "GET /api/v1/organizacion/empresas con testigo -> $CODIGO"
          test "$CODIGO" = "200"
          # `// 0` no basta: si el cuerpo no es el JSON esperado —un problem+json, una página de
          # error— jq no devuelve 0, devuelve NADA, y entonces `[ "$TOTAL" -lt 1 ]` revienta con
          # «integer expression expected» en vez de con el mensaje de este paso. Un paso que falla
          # por un error de shell no dice por qué ha fallado.
          RAZON=$(jq -r '.elementos[0].razonSocial // empty' empresas.json 2>/dev/null || true)
          TOTAL=$(jq -r '.total // 0' empresas.json 2>/dev/null || true)
          case "$TOTAL" in ''|*[!0-9]*) TOTAL=0 ;; esac
          echo "total=$TOTAL razonSocial=$RAZON"
          # El total se compara además con cero: una lista vacía es un 200 perfectamente formado,
          # y es exactamente lo que devolvería un esquema recién migrado sin sembrar.
          if [ "$TOTAL" -lt 1 ] || [ "$RAZON" != "Bastion Humo SL" ]; then
            echo "::error title=Lectura::El listado de empresas no trae la empresa sembrada (total=${TOTAL}, razonSocial=${RAZON})."
            exit 1
          fi
          echo "::notice title=Lectura::El entorno desplegado sirve datos: ${TOTAL} empresa(s), la primera «${RAZON}»."

      - name: El frontal carga
        run: |
          curl --fail --silent --show-error http://localhost:5173/ -o pagina.html
          grep -q '<div id="root"></div>' pagina.html
          grep -q '<title>Bastion</title>' pagina.html

      # El frontal y la API TIENEN que compartir origen: la cookie de refresco es
      # `__Host-bastion-refresco`, y ese prefijo solo viaja al origen exacto que la puso. Todo el
      # diseño del testigo depende de eso, así que se comprueba por el efecto —una petición que
      # entra por el puerto del frontal y la contesta la API— y no leyendo el `nginx.conf`.
      - name: El frontal reenvía /api a la API, por el mismo origen
        run: |
          RUTA=http://localhost:5173/api/v1/organizacion/empresas
          CODIGO=$(curl --silent --output /dev/null --write-out '%{http_code}' "$RUTA")
          echo "GET (por el frontal) /api/v1/organizacion/empresas sin credenciales -> $CODIGO"
          test "$CODIGO" = "401"

      # Un mapa de fuentes es el código fuente. Se genera, se publica como artefacto de la CI, y
      # NO se sirve: la imagen los borra y nginx contesta 404 a cualquiera que quede.
      - name: La imagen del frontal no publica los mapas de fuentes
        run: |
          MAPA=$(docker compose -f deploy/docker-compose.yml exec -T web sh -c "find /usr/share/nginx/html -name '*.map' | head -1")
          echo "Mapas dentro de la imagen: [${MAPA}]"
          test -z "$MAPA"

      # La instrumentación no se comprueba mirando si el paquete está en el csproj, sino
      # preguntándole al visor si le ha llegado algo.
      - name: Las trazas llegan al visor
        run: |
          curl --silent --output /dev/null http://localhost:8080/no-existe
          for INTENTO in $(seq 1 12); do
            if curl --fail --silent http://localhost:16686/api/services | grep -q 'bastion-api'; then
              echo "Jaeger conoce el servicio bastion-api (intento $INTENTO)."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Jaeger no ha recibido ninguna traza de bastion-api en 60 s."
          exit 1

      # El log de un *job* solo se descarga con autenticación; las ANOTACIONES, en cambio,
      # son públicas y se leen por API. Sin esto, un fallo aquí es un `exit 1` sin
      # explicación para quien no pueda bajarse el log — que es exactamente lo que pasó la
      # primera vez que corrió este *job*. Se emite el final de cada salida como anotación
      # (con los saltos de línea codificados como %0A, que es lo que exige el formato).
      - name: Diagnóstico
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml ps --all || true
          docker compose -f deploy/docker-compose.yml logs --no-color --tail 200 || true
          for FICHERO in construir.log postgres.log levantar.log; do
            [ -s "$FICHERO" ] || continue
            RESUMEN=$(tail -c 1200 "$FICHERO" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=${FICHERO}::${RESUMEN}"
          done
          # Lo decisivo cuando un servicio queda `unhealthy` es la SALIDA de la sonda, que
          # no aparece en los registros del contenedor: la guarda el demonio.
          # `migraciones` va el primero de la lista a propósito: si el esquema no se aplicó, todo
          # lo demás falla por consecuencia, y lo que hay que leer es su registro, no el de la API
          # quejándose de una tabla que no existe. No tiene sonda —se le desactiva—, así que
          # siempre entra por la rama de «no está sano», que aquí es justo lo que se quiere.
          for SERVICIO in migraciones postgres api web otel-collector jaeger; do
            CONTENEDOR=$(docker compose -f deploy/docker-compose.yml ps --all --quiet "$SERVICIO" | head -1)
            [ -n "$CONTENEDOR" ] || continue
            SALUD=$(docker inspect --format '{{json .State.Health}}' "$CONTENEDOR" 2>/dev/null || echo 'sin sonda')
            case "$SALUD" in
              *'"Status":"healthy"'*) continue ;;
            esac
            REGISTRO=$(docker compose -f deploy/docker-compose.yml logs --no-color --tail 20 "$SERVICIO" 2>&1 || true)
            RESUMEN=$(printf '%s\n---\n%s' "$SALUD" "$REGISTRO" | tail -c 1200 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=servicio ${SERVICIO}::${RESUMEN}"
          done

      - name: Tirar el entorno
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --volumes --remove-orphans
