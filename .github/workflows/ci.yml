name: CI

# Integración continua de Bastion (§14 del plan maestro).
#
# Vive en `.github/workflows/` y no en `deploy/.github/workflows/` como dibuja el §12:
# GitHub Actions SOLO ejecuta lo que encuentra en la raíz del repositorio. La decisión
# está anotada en `docs/PLAN.md`.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un push nuevo cancela el run anterior de la misma rama: el runner no gasta minutos
# en un commit que ya nadie va a mirar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # ==================================================================== FRONTAL
  # Corre de verdad desde el primer commit.
  frontend:
    name: Frontal (bastion-web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` y no `npm install`: instala EXACTAMENTE el lockfile y falla si el
      # package.json y el lock han divergido. Es la diferencia entre una construcción
      # reproducible y una que depende del día.
      - name: Instalar dependencias
        run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Linter
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tests
        run: npm run test

      - name: Construir
        run: npm run build

      # Presupuesto de tamaño (§14): que el frontal engorde tiene que doler en la CI,
      # no en el arranque del usuario seis meses después. Por eso se mide lo que el navegador
      # DESCARGA y se excluyen los `.map`: un sourcemap pesa más que el bundle y no se descarga
      # al arrancar, así que contarlo medía otra cosa distinta de la que dice esta frase.
      - name: Presupuesto de tamaño
        run: |
          TOPE_KB=1024
          TAMANO_KB=$(du -sk --exclude='*.map' dist | cut -f1)
          echo "Tamaño de dist/: ${TAMANO_KB} kB (tope ${TOPE_KB} kB)"
          echo "### Frontal: ${TAMANO_KB} kB / ${TOPE_KB} kB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TAMANO_KB" -gt "$TOPE_KB" ]; then
            echo "::error::El frontal supera el presupuesto de tamaño (${TAMANO_KB} kB > ${TOPE_KB} kB)."
            exit 1
          fi

      - name: Publicar el frontal construido
        uses: actions/upload-artifact@v4
        with:
          name: bastion-web-dist
          path: frontend/dist
          retention-days: 7

  # ==================================================================== BACKEND
  # Mientras `Bastion.sln` no exista (ítem 0.1 de docs/PLAN.md), este job DECLARA que
  # no ha comprobado nada en lugar de fingir un verde o dejar la CI en rojo sin
  # explicación. En cuanto el 0.1 cree la solución, los pasos se activan solos: no hay
  # que tocar este fichero, y a partir de ahí un fallo suyo es un fallo de verdad.
  backend:
    name: Backend (Bastion.sln)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ¿Existe ya la solución?
        id: solucion
        run: |
          if [ -f Bastion.sln ]; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Backend: pendiente del ítem 0.1"
              echo
              echo "No existe \`Bastion.sln\`, así que **no se ha compilado ni probado nada del backend**."
              echo "Esto es lo esperado hasta que se complete el ítem 0.1 del checklist de \`docs/PLAN.md\`;"
              echo "el agente de configuración no pudo crear la solución porque su entorno no tenía el SDK de .NET."
              echo
              echo "Este job se activa solo en cuanto exista la solución. **No hay que tocar el workflow.**"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Backend sin comprobar: falta Bastion.sln (ítem 0.1 de docs/PLAN.md)."
          fi

      - name: .NET
        if: steps.solucion.outputs.existe == 'true'
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      # `actions/setup-dotnet` falla en su POST-step si la carpeta de paquetes no existe, y
      # hoy no existe: los `packages.lock.json` solo tienen entradas "type": "Project", cero
      # paquetes de NuGet, así que ningún `restore` la crea. Un job con build, formato y tests
      # en verde se quedaba en rojo por eso (ADR-0002). Deja de hacer falta cuando lleguen
      # paquetes de verdad; mientras tanto, no estorba.
      - name: Asegurar la carpeta de paquetes
        if: steps.solucion.outputs.existe == 'true'
        run: mkdir -p ~/.nuget/packages

      - name: Restaurar
        if: steps.solucion.outputs.existe == 'true'
        run: dotnet restore Bastion.sln

      - name: Compilar
        if: steps.solucion.outputs.existe == 'true'
        run: dotnet build Bastion.sln --configuration Release --no-restore

      # Estilo y formato. Va aparte del build a propósito (ver Directory.Build.props):
      # un build roto significa siempre "el código está mal", nunca "falta un espacio".
      - name: Formato
        if: steps.solucion.outputs.existe == 'true'
        run: dotnet format Bastion.sln --verify-no-changes --no-restore

      # Rápidos y sin Docker: dominio puro + fitness functions de las fronteras del §4.
      # Van PRIMERO porque son los que fallan en segundos, no en minutos.
      - name: Tests de dominio y de arquitectura
        if: steps.solucion.outputs.existe == 'true'
        run: |
          dotnet test Bastion.sln \
            --configuration Release \
            --no-build \
            --filter "Category!=Integracion" \
            --logger "trx;LogFileName=dominio-arquitectura.trx" \
            --results-directory artifacts/test-results

      # Testcontainers levanta PostgreSQL de verdad. Nada de EF Core InMemory: no traduce
      # SQL real, ignora restricciones, columnas computadas y filtros globales, y da
      # falsos verdes (`stacks/dotnet/convenciones.md`).
      - name: Tests de integración (Testcontainers)
        if: steps.solucion.outputs.existe == 'true'
        run: |
          dotnet test Bastion.sln \
            --configuration Release \
            --no-build \
            --filter "Category=Integracion" \
            --logger "trx;LogFileName=integracion.trx" \
            --results-directory artifacts/test-results

      # Un esquema y un modelo que divergen es un despliegue roto en diferido (§14).
      - name: Migraciones — el modelo no tiene cambios pendientes
        if: steps.solucion.outputs.existe == 'true'
        run: |
          if [ -f scripts/comprobar-migraciones.sh ]; then
            bash scripts/comprobar-migraciones.sh
          else
            echo "::notice::Sin comprobación de migraciones todavía (se añade con el primer DbContext, ítem 0.4)."
          fi

      # El OpenAPI es el contrato del que se genera el cliente de TypeScript: se publica
      # como artefacto para que el frontal lo consuma en vez de escribir DTOs a mano.
      - name: Publicar el OpenAPI
        if: steps.solucion.outputs.existe == 'true' && hashFiles('docs/api/openapi.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/api/openapi.json
          retention-days: 30

      - name: Publicar resultados de test
        if: always() && steps.solucion.outputs.existe == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results
          retention-days: 7

  # ==================================================================== IMÁGENES
  # Solo comprueba que los Dockerfile construyen; no publica nada. La publicación es
  # cosa de `cd.yml`, que se escribirá cuando haya a dónde desplegar.
  imagenes:
    name: Imágenes de contenedor
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Construir la imagen del frontal
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Construir la imagen de la API
        # Igual que el job `backend`: sin solución no hay nada que construir.
        if: hashFiles('Bastion.sln') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ======================================================================== HUMO
  # Levanta el entorno COMPLETO con docker compose y comprueba el criterio de aceptación
  # del ítem 0.2 por el efecto, no por el fichero: que la API responde a su sonda de vida,
  # que la de disponibilidad ve PostgreSQL de verdad, que el frontal carga y que las trazas
  # llegan al visor.
  #
  # Está en la CI y no solo en la máquina de quien desarrolla porque así se comprueba
  # SIEMPRE, en un equipo limpio, y no "la vez que lo probé".
  humo:
    name: Humo (docker compose)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    steps:
      - uses: actions/checkout@v5

      # Las credenciales se generan aquí y mueren con el runner. En el repositorio no hay
      # —ni puede haber— un `deploy/.env`: está en .gitignore y en .dockerignore.
      - name: Preparar deploy/.env
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "JWT_SIGNING_KEY=$(openssl rand -base64 48)"
          } > deploy/.env

      # Valida e interpola el fichero sin levantar nada. `--quiet` es obligatorio: la salida
      # de `config` incluye las credenciales ya sustituidas.
      - name: Validar el compose
        run: docker compose -f deploy/docker-compose.yml config --quiet

      # Construir y levantar van en pasos SEPARADOS, y PostgreSQL antes que el resto, a
      # propósito: los logs de un *run* solo se leen con autenticación, así que la
      # conclusión de cada paso es la única señal pública que localiza el fallo. Un único
      # paso «up --build» solo sabe decir «algo ha fallado».
      - name: Construir las imágenes
        run: |
          set -o pipefail
          docker compose -f deploy/docker-compose.yml build --progress plain 2>&1 | tee construir.log

      - name: Levantar PostgreSQL
        run: |
          set -o pipefail
          docker compose -f deploy/docker-compose.yml up --detach --wait --wait-timeout 180 postgres 2>&1 | tee postgres.log

      # `--wait` espera a que cada servicio con sonda esté SANO, no solo arrancado.
      - name: Levantar el resto del entorno
        run: |
          set -o pipefail
          docker compose -f deploy/docker-compose.yml up --detach --wait --wait-timeout 300 2>&1 | tee levantar.log

      - name: Estado de los servicios
        run: docker compose -f deploy/docker-compose.yml ps --all

      - name: La API responde a su sonda de VIDA
        run: |
          RESPUESTA=$(curl --fail --silent --show-error http://localhost:8080/health/live)
          echo "/health/live -> $RESPUESTA"
          test "$RESPUESTA" = "Healthy"

      # Esto es lo que NO puede comprobar un test funcional en memoria: que hay un
      # PostgreSQL de verdad al otro lado y que la API sabe llegar a él.
      - name: La sonda de DISPONIBILIDAD ve PostgreSQL
        run: |
          RESPUESTA=$(curl --fail --silent --show-error http://localhost:8080/health/ready)
          echo "/health/ready -> $RESPUESTA"
          echo "$RESPUESTA" | grep -q '"nombre":"base-de-datos","estado":"Healthy"'

      - name: El frontal carga
        run: |
          curl --fail --silent --show-error http://localhost:5173/ -o pagina.html
          grep -q '<div id="root"></div>' pagina.html
          grep -q '<title>Bastion</title>' pagina.html

      # La instrumentación no se comprueba mirando si el paquete está en el csproj, sino
      # preguntándole al visor si le ha llegado algo.
      - name: Las trazas llegan al visor
        run: |
          curl --silent --output /dev/null http://localhost:8080/no-existe
          for INTENTO in $(seq 1 12); do
            if curl --fail --silent http://localhost:16686/api/services | grep -q 'bastion-api'; then
              echo "Jaeger conoce el servicio bastion-api (intento $INTENTO)."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Jaeger no ha recibido ninguna traza de bastion-api en 60 s."
          exit 1

      # El log de un *job* solo se descarga con autenticación; las ANOTACIONES, en cambio,
      # son públicas y se leen por API. Sin esto, un fallo aquí es un `exit 1` sin
      # explicación para quien no pueda bajarse el log — que es exactamente lo que pasó la
      # primera vez que corrió este *job*. Se emite el final de cada salida como anotación
      # (con los saltos de línea codificados como %0A, que es lo que exige el formato).
      - name: Diagnóstico
        if: failure()
        run: |
          docker compose -f deploy/docker-compose.yml ps --all || true
          docker compose -f deploy/docker-compose.yml logs --no-color --tail 200 || true
          for FICHERO in construir.log postgres.log levantar.log; do
            [ -s "$FICHERO" ] || continue
            RESUMEN=$(tail -c 1200 "$FICHERO" | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=${FICHERO}::${RESUMEN}"
          done
          # Lo decisivo cuando un servicio queda `unhealthy` es la SALIDA de la sonda, que
          # no aparece en los registros del contenedor: la guarda el demonio.
          for SERVICIO in postgres api web otel-collector jaeger; do
            CONTENEDOR=$(docker compose -f deploy/docker-compose.yml ps --all --quiet "$SERVICIO" | head -1)
            [ -n "$CONTENEDOR" ] || continue
            SALUD=$(docker inspect --format '{{json .State.Health}}' "$CONTENEDOR" 2>/dev/null || echo 'sin sonda')
            case "$SALUD" in
              *'"Status":"healthy"'*) continue ;;
            esac
            REGISTRO=$(docker compose -f deploy/docker-compose.yml logs --no-color --tail 20 "$SERVICIO" 2>&1 || true)
            RESUMEN=$(printf '%s\n---\n%s' "$SALUD" "$REGISTRO" | tail -c 1200 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=servicio ${SERVICIO}::${RESUMEN}"
          done

      - name: Tirar el entorno
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --volumes --remove-orphans
