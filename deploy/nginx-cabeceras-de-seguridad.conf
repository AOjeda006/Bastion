# Cabeceras de seguridad del frontal (`herramientas/seguridad.md`).
#
# ESTÁ EN UN FICHERO APARTE POR UN MOTIVO, NO POR ORDEN
# ----------------------------------------------------
# `add_header` NO se hereda de un bloque al de dentro si el de dentro tiene su propio
# `add_header`. Con las cabeceras escritas solo en `server`, la `location /assets/` —que
# declara su `Cache-Control`— se quedaba SIN ninguna de ellas: sin `nosniff`, sin CSP y sin
# `X-Frame-Options`, justo en la ruta por la que se sirve todo el JavaScript. Es un fallo
# silencioso: la portada sale con las cabeceras puestas y quien las comprueba ahí las ve.
#
# Repetirlas a mano en cada `location` es exactamente igual de correcto y se desincroniza a la
# primera. Así que se escriben una vez y se incluyen en todas.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
