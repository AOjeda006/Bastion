# Servido del frontal de Bastion. La imagen es `nginx-unprivileged`: uid 101, puerto 8080.
#
# EL FRONTAL Y LA API COMPARTEN ORIGEN, Y NO ES UNA COMODIDAD
# ----------------------------------------------------------
# `/api/` se reenvía a la API desde aquí, así que para el navegador todo es el mismo origen. Tiene
# que ser así porque la cookie de refresco es `__Host-bastion-refresco`, y ese prefijo exige
# `Secure`, sin `Domain` y con `Path=/`: solo viaja al origen exacto que la puso. Servir el frontal
# en un origen y la API en otro obligaría a `SameSite=None` y a CORS con credenciales, que es
# cambiar una configuración de proxy por una superficie de ataque.
#
# Por eso el empaquetado del frontal no lleva ninguna URL absoluta ni ninguna `VITE_API_URL`: pide
# a `/api/...` y quien decide dónde está eso es este fichero (y el proxy de Vite en desarrollo).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Se declaran en el `server` Y en cada `location` que tenga su propio `add_header`; el porqué
    # está escrito en el fichero incluido, y no es cosmético.
    include /etc/nginx/cabeceras-de-seguridad.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # La API, por el mismo origen. `proxy_pass` sin barra final para que la ruta llegue entera:
    # `/api/v1/...` tiene que salir de aquí siendo `/api/v1/...`, que es como la API la enruta.
    location /api/ {
        include /etc/nginx/cabeceras-de-seguridad.conf;

        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Una respuesta de la API no se guarda en ninguna caché intermedia: lleva datos de una
        # empresa concreta, y la empresa va dentro del testigo y no en la URL.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Los artefactos con huella en el nombre son inmutables; el index.html, nunca.
    location /assets/ {
        include /etc/nginx/cabeceras-de-seguridad.conf;

        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/cabeceras-de-seguridad.conf;

        add_header Cache-Control "no-cache";
    }

    # Un mapa de fuentes es el código fuente. La imagen ya no lo lleva —`Dockerfile.web` los borra—
    # y esto es el segundo cerrojo, para que subirlo por descuido no lo publique.
    location ~ \.map$ {
        return 404;
    }

    # SPA: cualquier ruta desconocida la resuelve el enrutador del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
