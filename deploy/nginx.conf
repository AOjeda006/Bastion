# Servido del frontal de Bastion. La imagen es `nginx-unprivileged`: uid 101, puerto 8080.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeceras de seguridad (`herramientas/seguridad.md`). La CSP se aprieta en el
    # ítem 0.11, cuando se sepa qué orígenes usa de verdad el shell de React.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Los artefactos con huella en el nombre son inmutables; el index.html, nunca.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: cualquier ruta desconocida la resuelve el enrutador del cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
